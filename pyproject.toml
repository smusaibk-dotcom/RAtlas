[project]
name = "backend"
version = "0.1.0"
description = "AI-powered Research Operating System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.2",
    "docling>=2.114.0",
    "faster-whisper>=1.2.1",
    "gitpython>=3.1.52",
    "html5lib>=1.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.24.0",
    "langchain>=1.3.14",
    "langchain-core>=1.4.9",
    "langgraph>=1.2.9",
    "llama-index>=0.14.23",
    "llama-index-core>=0.14.23",
    "llama-index-readers-github>=0.11.2",
    "llama-index-readers-youtube-transcript>=0.5.0",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "plotly>=6.9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "readability-lxml>=0.8.4.1",
    "streamlit>=1.60.0",
    "streamlit-option-menu>=0.4.0",
    "tavily-python>=0.7.26",
    "tiktoken>=0.13.0",
    "trafilatura>=2.1.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
